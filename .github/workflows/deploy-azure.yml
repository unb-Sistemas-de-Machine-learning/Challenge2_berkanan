name: Deploy Azure Staging — Challenge 2 Berkanan

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Ambiente de destino na Azure"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
      force_reindex:
        description: "Forçar reindexação da coleção ChromaDB durante o deploy"
        required: true
        default: false
        type: boolean
      use_ghcr:
        description: "Usar imagem pré-compilada do GHCR (docker compose pull) em vez de build na VM"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: deploy-azure-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  pre-deploy-checks:
    name: Pré-validação (Baseline, Testes Unitários e Compose)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configurar Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Verificar integridade do baseline e fontes oficiais
        run: python3 scripts/verify_baseline.py

      - name: Instalar dependências e rodar testes unitários
        run: |
          python3 -m pip install -r backend/requirements.txt
          (cd backend && python3 -m unittest discover -s tests -v)
          (cd mlops/experiments && python3 -m unittest discover -s tests -t . -v)

      - name: Validar Compose de desenvolvimento e produção Azure
        run: bash infra/scripts/check_compose.sh

  deploy-vm-brazilsouth:
    name: Deploy Controlado na VM Azure (brazilsouth)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: pre-deploy-checks
    environment: azure-${{ inputs.environment }}
    steps:
      - name: Verificar configuração dos secrets de deploy
        env:
          AZURE_VM_HOST: ${{ secrets.AZURE_VM_HOST }}
          AZURE_VM_USER: ${{ secrets.AZURE_VM_USER }}
          AZURE_VM_SSH_KEY: ${{ secrets.AZURE_VM_SSH_KEY }}
          AZURE_DEPLOY_PATH: ${{ secrets.AZURE_DEPLOY_PATH }}
        run: |
          for var in AZURE_VM_HOST AZURE_VM_USER AZURE_VM_SSH_KEY AZURE_DEPLOY_PATH; do
            if [ -z "${!var}" ]; then
              echo "[ERRO] Secret obrigatório ausente no Environment azure-${{ inputs.environment }}: ${var}" >&2
              exit 1
            fi
          done

      - name: Configurar chave SSH efêmera
        env:
          AZURE_VM_SSH_KEY: ${{ secrets.AZURE_VM_SSH_KEY }}
          AZURE_VM_HOST: ${{ secrets.AZURE_VM_HOST }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${AZURE_VM_SSH_KEY}" > ~/.ssh/azure_deploy_key
          chmod 600 ~/.ssh/azure_deploy_key
          ssh-keyscan -H "${AZURE_VM_HOST}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Atualizar repositório na VM e executar bootstrap com rollback automático
        env:
          AZURE_VM_HOST: ${{ secrets.AZURE_VM_HOST }}
          AZURE_VM_USER: ${{ secrets.AZURE_VM_USER }}
          AZURE_DEPLOY_PATH: ${{ secrets.AZURE_DEPLOY_PATH }}
          TARGET_SHA: ${{ github.sha }}
          FORCE_REINDEX_FLAG: ${{ inputs.force_reindex }}
          USE_GHCR_FLAG: ${{ inputs.use_ghcr }}
        run: |
          FORCE_NUM=0
          if [ "${FORCE_REINDEX_FLAG}" = "true" ]; then
            FORCE_NUM=1
          fi
          USE_GHCR_NUM=1
          if [ "${USE_GHCR_FLAG}" = "false" ]; then
            USE_GHCR_NUM=0
          fi
          ssh -i ~/.ssh/azure_deploy_key -o StrictHostKeyChecking=accept-new "${AZURE_VM_USER}@${AZURE_VM_HOST}" \
            "DEPLOY_PATH='${AZURE_DEPLOY_PATH}' TARGET_SHA='${TARGET_SHA}' FORCE_REINDEX='${FORCE_NUM}' USE_GHCR='${USE_GHCR_NUM}' bash -s" <<'REMOTE_EOF'
          set -euo pipefail
          cd "${DEPLOY_PATH}"
          PREV_SHA="$(git rev-parse HEAD)"
          echo "[INFO] Commit anterior na VM: ${PREV_SHA}"

          rollback() {
            echo "[ALERTA] Deploy falhou! Executando rollback para ${PREV_SHA}..." >&2
            git checkout -f "${PREV_SHA}"
            FORCE_REINDEX=0 USE_GHCR="${USE_GHCR}" bash infra/azure/bootstrap_stack.sh || true
            exit 1
          }
          trap rollback ERR

          git fetch --prune origin
          git checkout -f "${TARGET_SHA}"
          FORCE_REINDEX="${FORCE_REINDEX}" USE_GHCR="${USE_GHCR}" bash infra/azure/bootstrap_stack.sh
          trap - ERR
          echo "[OK] Deploy concluído no commit ${TARGET_SHA}."
          REMOTE_EOF

      - name: Remover chave SSH efêmera
        if: always()
        run: rm -f ~/.ssh/azure_deploy_key
