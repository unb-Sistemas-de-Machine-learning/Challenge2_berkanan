name: Segurança, LGPD e Migrações SQL — Challenge 2 Berkanan

on:
  pull_request:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "infra/**"
      - "ci/**"
      - "mlops/**"
      - "chore/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-and-lgpd:
    name: Guardião de Segurança, LGPD e Imutabilidade SQL
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout do repositório com histórico completo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Configurar Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Executar validador de segurança, LGPD e migrações SQL
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "${EVENT_NAME}" = "pull_request" ] && [ -n "${BASE_REF}" ]; then
            python3 scripts/validate_repository_safety.py --base-ref "origin/${BASE_REF}"
          else
            python3 scripts/validate_repository_safety.py
          fi

      - name: Executar testes unitários do validador de segurança
        run: |
          (cd mlops/experiments && python3 -m unittest tests/test_repository_safety.py -v)

  postgres-migrations-check:
    name: Validar Migrações e Views em PostgreSQL 16.4
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_DB: berkanan_ci
          POSTGRES_USER: berkanan_user
          POSTGRES_PASSWORD: ci_ephemeral_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U berkanan_user -d berkanan_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Garantir cliente psql disponível
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq postgresql-client
          fi

      - name: Aplicar migrações + seeds (1ª execução) e validar idempotência (2ª execução)
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
          DB_NAME: berkanan_ci
          DB_USER: berkanan_user
          PGPASSWORD: ci_ephemeral_test_only
          SEED: "1"
        run: |
          bash migrations/migrate.sh
          bash migrations/migrate.sh

      - name: Validar tabelas, views vw_* e publicar resumo no PR
        env:
          PGPASSWORD: ci_ephemeral_test_only
        run: |
          PSQL=(psql -h 127.0.0.1 -p 5432 -U berkanan_user -d berkanan_ci -t -A -v ON_ERROR_STOP=1)
          MIG_COUNT=$("${PSQL[@]}" -c "SELECT COUNT(*) FROM schema_migrations;")
          FONTES_COUNT=$("${PSQL[@]}" -c "SELECT COUNT(*) FROM fontes_documentos;")
          TACO_COUNT=$("${PSQL[@]}" -c "SELECT COUNT(*) FROM taco_alimentos;")
          LIMITES_COUNT=$("${PSQL[@]}" -c "SELECT COUNT(*) FROM limites_rotulagem;")
          "${PSQL[@]}" -c "SELECT * FROM vw_metricas_agregadas_diarias LIMIT 1;" >/dev/null
          "${PSQL[@]}" -c "SELECT * FROM vw_checagem_limiares_monitoramento LIMIT 1;" >/dev/null
          {
            echo "### Segurança, LGPD e PostgreSQL 16.4 (CI)"
            echo ""
            echo "| Verificação | Resultado |"
            echo "|---|---|"
            echo "| Migrações/seeds aplicados (idempotente 2x) | \`${MIG_COUNT}\` registros em \`schema_migrations\` |"
            echo "| Fontes oficiais (\`fontes_documentos\`) | \`${FONTES_COUNT}\` registros |"
            echo "| Tabela TACO (\`taco_alimentos\`) | \`${TACO_COUNT}\` registros |"
            echo "| Limites IN 75 (\`limites_rotulagem\`) | \`${LIMITES_COUNT}\` registros |"
            echo "| Views \`vw_metricas_agregadas_diarias\` e \`vw_checagem_limiares_monitoramento\` | Consultáveis (\`OK\`) |"
          } >> "${GITHUB_STEP_SUMMARY}"
