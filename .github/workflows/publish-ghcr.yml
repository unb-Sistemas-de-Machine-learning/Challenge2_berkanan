name: Publish Backend Image (GHCR) — Challenge 2 Berkanan

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/publish-ghcr.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-ghcr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push-ghcr:
    name: Build e Push da Imagem CPU-only no GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticar no GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir e publicar imagem CPU-only do backend no GHCR
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/unb-sistemas-de-machine-learning/challenge2-backend:prod
            ghcr.io/unb-sistemas-de-machine-learning/challenge2-backend:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Challenge 2 Berkanan FastAPI backend (CPU-only)
          cache-from: type=gha
          cache-to: type=gha,mode=max
