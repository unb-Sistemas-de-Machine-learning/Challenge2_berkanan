name: CI — Challenge 2 Berkanan

on:
  push:
    branches:
      - main
      - "infra/**"
      - "feat/**"
      - "fix/**"
      - "chore/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-and-baseline:
    name: Validar Baseline, Sintaxe e Smoke Tests (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configurar Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Verificar integridade SHA-256 do baseline e fontes de contexto
        run: python3 scripts/verify_baseline.py

      - name: Instalar dependências do backend
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r backend/requirements.txt

      - name: Validar sintaxe Python (backend e scripts)
        run: |
          python3 -m py_compile backend/main.py backend/graph.py backend/schemas.py backend/state.py scripts/verify_baseline.py

      - name: Executar smoke tests da API FastAPI
        run: bash scripts/smoke_backend.sh

  docker-and-compose:
    name: Validar Containers Docker e Docker Compose
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: backend-and-baseline
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validar configuração do Docker Compose
        run: bash infra/scripts/check_compose.sh

      - name: Construir imagem Docker do backend
        run: docker build --tag berkanan/challenge2-backend:ci ./backend

      - name: Executar smoke test contra o container do backend
        run: |
          docker run -d --rm --name berkanan-backend-ci -p 127.0.0.1:8000:8000 berkanan/challenge2-backend:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/openapi.json >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          bash scripts/smoke_backend.sh
          docker stop berkanan-backend-ci
