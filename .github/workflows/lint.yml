name: Lint — Challenge 2 Berkanan

on:
  push:
    branches:
      - main
      - "infra/**"
      - "feat/**"
      - "fix/**"
      - "chore/**"
      - "docs/**"
      - "ci/**"
      - "mlops/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Linters (Ruff, ShellCheck e yamllint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configurar Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Instalar ferramentas de lint (Ruff e yamllint)
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install "ruff<1" "yamllint<2"

      - name: Python Lint (Ruff)
        run: |
          ruff --version
          ruff check backend scripts mlops/experiments

      - name: Shell Lint (ShellCheck)
        shell: bash
        run: |
          shellcheck --version
          mapfile -t sh_files < <(find scripts migrations infra -type f -name "*.sh" | sort)
          printf "Verificando %d script(s) Shell:\n" "${#sh_files[@]}"
          printf "  - %s\n" "${sh_files[@]}"
          shellcheck -S warning "${sh_files[@]}"

      - name: YAML Lint (yamllint)
        run: |
          yamllint --version
          yamllint -c .yamllint.yml \
            .yamllint.yml \
            .github/workflows/ \
            mlops/ \
            compose.yaml \
            infra/azure/compose.prod.yaml \
            docs/context/MANIFEST.yaml
