name: MLOps Governance — Challenge 2 Berkanan

on:
  pull_request:
    paths:
      - "mlops/**"
      - "scripts/validate_mlops_governance.py"
      - ".github/workflows/mlops-governance.yml"
  push:
    branches:
      - main
      - "mlops/**"
      - "feat/**"
      - "fix/**"
      - "infra/**"
      - "docs/**"
    paths:
      - "mlops/**"
      - "scripts/validate_mlops_governance.py"
      - ".github/workflows/mlops-governance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mlops-governance:
    name: Validar Governança MLOps (Prompts, Manifesto e Gabaritos)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout do repositório com histórico completo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Configurar Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Instalar PyYAML
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pyyaml

      - name: Executar validador de governança MLOps (ADR-006)
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "${EVENT_NAME}" = "pull_request" ] && [ -n "${BASE_REF}" ]; then
            python3 scripts/validate_mlops_governance.py --base-ref "origin/${BASE_REF}"
          else
            python3 scripts/validate_mlops_governance.py
          fi

      - name: Executar testes unitários de governança MLOps
        run: |
          (cd mlops/experiments && python3 -m unittest tests/test_mlops_governance.py -v)

      - name: Publicar resumo da governança MLOps no PR
        if: always()
        run: |
          python3 - <<'PY' >> "${GITHUB_STEP_SUMMARY}"
          import pathlib
          import yaml

          print("### Governança MLOps (ADR-006)\n")
          print("| Arquivo | `prompt_id` | Versão | Status |")
          print("|---|---|---|---|")
          for path in sorted(pathlib.Path("mlops/prompts").glob("*.yaml")):
              data = yaml.safe_load(path.read_text(encoding="utf-8")) or {}
              print(
                  f"| `{path.name}` | `{data.get('prompt_id', '-')}` | "
                  f"`{data.get('version', '-')}` | `{data.get('status', '-')}` |"
              )
          PY
