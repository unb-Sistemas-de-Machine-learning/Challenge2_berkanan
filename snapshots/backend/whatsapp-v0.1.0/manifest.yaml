identified_interfaces:
  fastapi_app_object: "main:api"
  http_endpoints:
    - method: "POST"
      path: "/api/analyze"
      request_model: "AnalysisRequest"
      response_model: "AnalysisResponse"
  langgraph_workflow:
    compiled_object: "graph:app"
    entry_point: "coordinator"
    nodes:
      - "coordinator (coordinator_node)"
      - "nutritional (nutritional_agent_node)"
      - "verifier (verifier_agent_node)"
    edges:
      - "coordinator -> nutritional"
      - "nutritional -> verifier (se enable_verifier == True) | END (se enable_verifier == False)"
      - "verifier -> END"

dependencies:
  - "fastapi>=0.115.0"
  - "uvicorn>=0.32.0"
  - "pydantic>=2.9.0"
  - "langgraph>=0.2.0"
  - "langchain-core>=0.3.0"

available_tests:
  - path: "backend/test_api.sh"
    description: >
      Executa duas requisições POST /api/analyze via curl (com enable_verifier=true e
      enable_verifier=false) e formata a saída com python3 -m json.tool. Não realiza
      asserções automatizadas de código HTTP ou campos de contrato.

known_limitations:
  - "O nó nutritional_agent_node retorna texto, fontes (Guia Alimentar pág. 45), avisos e classificação fixos/simulados."
  - "O nó coordinator_node retorna dicionário vazio sem roteamento condicional real por request_type (ocr_analysis, comparison, qa)."
  - "O agente de comparação ainda não existe no grafo."
  - "O nó verifier_agent_node apenas verifica se a lista matched_sources não está vazia; não realiza verificação por regras completas (Config. B) nem chamada real ao LLM (Config. C)."
  - "Não há conexão nem integração com PostgreSQL (TACO, limites IN 75, produtos_lidos, metricas_requisicao)."
  - "Não há conexão nem integração com ChromaDB ou modelo de embeddings."
  - "Não há pré-processamento OpenCV nem execução de OCR (Tesseract/PaddleOCR); o campo image_base64 é apenas repassado ao estado."
  - "O script test_api.sh não retorna código de saída de erro caso a API falhe ou retorne payload inválido."
