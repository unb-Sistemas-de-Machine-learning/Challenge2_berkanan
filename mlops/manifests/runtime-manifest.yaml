schema_version: "1.0"
manifest_type: "mlops_runtime_configuration"
project: "Challenge 2 Berkanan"
maintained_by: "Equipe Berkanan (R1 a R7 — Governança MLOps R7)"
last_updated: "2026-11-24"

configuration:
  config_id: "cfg-main-staging-ready-2026-11-24"
  environment: "development / azure-staging"
  status: "PARTIAL_INTEGRATION_STAGING_READY"
  code_baseline_id: "backend-whatsapp-v0.1.0"
  code_git_commit: "335d0d765bf11c01dd38a6a5609f90f5343928d1"
  implemented_in_main:
    - "backend/coordinator.py (roteamento deterministico por regras)"
    - "backend/nutritional_agent.py (agente nutricional com Gemini + RAG + IN 75/TACO)"
    - "backend/comparison_agent.py (comparacao deterministica)"
    - "backend/verifier_agent.py (verificador por regras Config. B e por LLM Config. C)"
    - "backend/rotulagem.py (calculo deterministico ALTO EM IN 75/2020)"
    - "backend/ocr_extraction.py (OCR pytesseract + regex RDC 429, alergenicos e consistencia)"
    - "backend/main.py e backend/schemas.py (verifier_mode, llm_calls reais e aquecimento RAG assincrono)"
    - "backend/database.py e backend/chroma_client.py (PostgreSQL + ChromaDB sem regras viciadas)"
    - "migrations/001 a 011 + scripts/ingest_chroma.py (base_conhecimento_v2)"
    - "mlops/experiments/ (conjunto_validacao.csv, gabarito_fotos/ por pessoa e comparar_llm.py)"
  pending_or_in_pr:
    - "PR #45: excecoes do Anexo XVI da IN 75 (issue #21)"
    - "frontend/: aplicacao web Mobile First React + Vite + Tailwind (R5)"

execution_trace:
  experiment_id: "not_configured"
  execution_timestamp_utc: "not_configured"
  executed_by: "not_configured"

llm:
  primary_provider: "gemini"
  primary_model_name: "not_configured (aguardando fechamento do benchmark #17/#22)"
  primary_model_version: "not_configured"
  fallback_provider: "not_configured"
  fallback_model_name: "not_configured (ferramenta de comparacao no PR #44 / issue #22)"
  vision_fallback_enabled: false
  max_llm_calls_per_response: 2
  inference_parameters:
    temperature: 0.0
    max_output_tokens: "not_configured"
    top_p: "not_configured"
    top_k: "not_configured"

prompts:
  registry_path: "mlops/prompts/"
  coordinator_routing: "deterministic_rules_only (no_llm_prompt)"
  nutritional_agent_prompt_version: "inline_in_nutritional_agent_py (pendente de extracao para mlops/prompts/)"
  comparison_agent_prompt_version: "deterministic_rules_only (no_llm_prompt)"
  verifier_agent_prompt_version: "inline_in_verifier_agent_py (Config. C — pendente de extracao para mlops/prompts/)"

knowledge_base_rag:
  vector_store: "chromadb"
  index_version: "base_conhecimento_v2"
  index_status: "indexed_in_chromadb (1951 trechos de 500 chars / 100 overlap em base_conhecimento_v2 com normas extraidas de HTML oficial do DOU/Planalto, incluindo RDC 727/2022 e Lei 10.674/2003, e modelo multilingue explicito)"
  embedding_provider: "huggingface"
  embedding_model_name: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
  chunking_parameters:
    chunk_size_chars: 500
    chunk_overlap_chars: 150
  required_chunk_metadata:
    - "documento"
    - "fonte_id"
    - "arquivo"
    - "pagina"
    - "versao_indice"

structured_database:
  engine: "postgresql"
  engine_version: "16.4"
  schema_migrations_status: "configured_in_repo (migracoes 001-011 com carga da TACO, limites IN 75/2020, fontes da OMS, conferencia das fontes, RDC 727/2022 e Lei 10.674/2003 e seeds integradas em migrations/ e compose.yaml)"
  tables_expected:
    - "fontes_documentos"
    - "taco_alimentos"
    - "limites_rotulagem"
    - "produtos_lidos"
    - "metricas_requisicao"

ocr_pipeline:
  preprocessing: "opencv / pillow (em integracao no PR #40 e benchmark #18/#24)"
  ocr_tool: "not_configured (pendente de benchmark Semana 4: tesseract vs paddleocr — issue #24)"
  ocr_tool_version: "not_configured"
  client_compression_target:
    max_side_px: 1280
    format: "JPEG"
    max_size_bytes: 307200
  mandatory_user_confirmation: true

verifier:
  configurable_flag: "enable_verifier"
  mode_flag: "verifier_mode (rules | llm — implementado na main / issue #13)"
  default_enabled: true
  current_implementation_state: "rules_config_B_and_llm_config_C_implemented_in_main"
  benchmark_configurations:
    config_A: "Sem verificador (enable_verifier=false)"
    config_B: "Verificacao deterministica por regras em codigo (sem chamada adicional ao LLM)"
    config_C: "Agente verificador com LLM"
  adoption_rule_for_config_C:
    min_fidelity_gain_percentage_points_over_B: 5.0
    max_additional_latency_seconds_over_B: 3.0
  selected_production_config: "not_configured (aguardando benchmark #16)"

monitoring:
  backend_storage: "postgresql (tabela metricas_requisicao + logs de aplicacao)"
  schema_contract_status: "CONFIRMADO por R6/R7 na issue #7 (migrations/004_metricas.sql + backend/database.py)"
  prometheus_enabled: false
  grafana_status: "optional_week_5_not_configured"
  quality_thresholds:
    min_ocr_extraction_accuracy_pct: 85.0
    min_source_fidelity_pct: 90.0
    min_rag_recall_top3_pct: 80.0
    min_out_of_scope_refusal_pct: 90.0
    max_median_latency_4g_seconds: 10.0
    max_avg_llm_calls_per_response: 2.0

deployment:
  adr_reference: "docs/adr/adr_009.md (PROPOSTO para validacao de R2/R3)"
  cloud_provider: "azure"
  region: "brazilsouth"
  topology: "hybrid_vm_docker_compose_caddy_plus_static_web_apps"
  backend_compose_file: "infra/azure/compose.prod.yaml"
  tls_termination: "caddy (Let's Encrypt HTTPS automatico na porta 443)"
  frontend_hosting: "Azure Static Web Apps (Free) — PENDENTE de entrega de frontend/ por R5"
  cd_workflow: ".github/workflows/deploy-azure.yml (workflow_dispatch com rollback automatico)"
